<!DOCTYPE html>

<html>
  <head>

    <title> Let's Go France**** </title>
    <meta charset="utf-8"> <!-- charset --> 
    <meta name="description" content="admin page" /> 
    <meta name="author" content="Jeremy Unanue, Shane McCarthy" />
    <meta name="viewport" content="width=device-width, initial-scale=1"> <!-- viewport --> 
 
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"> <!-- Bootstrap CSS --> 
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script> <!-- Bootstrap JS --> 
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">  <!-- Bootstrap Icons -->   

    <style>

      .bg-text 
      {
        text-align: center; 
        color: white;
        text-shadow: 2px 2px 5px rgba(0,0,0,0.8), 0px 0px 2px  rgba(0,0,0,1);
      }
      /* Current BG images are placeholders */
      .hero-bg-image 
      {
        background-image: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), url('./images/paris-florian-wehde-408590-unsplash.jpeg');

        /* Set a specific height */
        height: 50%;

        /* Position and center the image to scale nicely on all screens */
        background-position: center;
        background-repeat: no-repeat;
        background-size: cover;
        position: relative;
      }

      .scroll
      {
        height: 500px;
        overflow-y: scroll;
      }

			.list-group-item{height: 150px;}

			.listing-body
			{
				max-height: 70px;
				overflow: hidden; 
    		text-overflow: ellipsis; 
				white-space: normal;
			};


    </style>

</head>

<body>

  <div class="container-fluid">
    <header class="d-flex flex-wrap align-items-center justify-content-center justify-content-md-between py-3 mb-4 border-bottom border-danger">
			<div class="d-flex align-items-center col-md-3 mb-2 mb-md-0 text-dark text-decoration-none">
        <img class="img-fluid" width="100px" height="100px" src="./images/frlogo.jpg" alt="France Icon">
      </div>

      <ul class="nav col-12 col-md-auto mb-2 justify-content-center mb-md-0">
        <li><a href="./homepage.html" class="nav-link px-2 link-secondary"><i class="bi bi-house-door"></i></a></li>
        <li><a href="./eventspage.html" class="nav-link px-2 link-dark">Events</a></li>
        <li><a href="#" class="nav-link px-2 link-dark">Study Abroad</a></li>
        <li><a href="./internshippage.html" class="nav-link px-2 link-dark">Internships</a></li>
        <li><a href="./servicepage.html" class="nav-link px-2 link-dark">Services</a></li>
        <li><a href="#" class="nav-link px-2 link-dark">Resources</a></li>
        <li><a href="./mediapage.html" class="nav-link px-2 link-dark">Media</a></li>
      </ul>
    </header>
  </div>

  <!-- Hero -->
  <div class="container-fluid">
    <div class="hero-bg-image p-5 text-center rounded mb-5">
      <div class="bg-text" style="text-align: center; color: white;"> <!-- Need to find a better text color -->
        <h1 style="font-weight: bold;">Admin Page - Listings</h1>
        <p>Manage Listings Here.</p>
      </div>
    </div>
  </div>

            
  <!--Listing Preview (List Group)-->
  <div class="container">
    <div class="row align-items-center mb-3">

      <div class="col col-md-6">
        <h1>Listings</h1>
      </div>

      <div class="col col-md-4">
        <div class="input-group">
          <select class="form-control" name="filter" id="filter" required>
              <option id="all" value="/listings" selected default>all</option>
              <option id="event" value="/listings/Events">Event</option>
              <option id="internship" value="/listings/Internships">Internship</option>
              <option id="service" value="/listings/Services">Service</option>
              <option id="resource" value="/listings/Resouces">Resource</option>
              <option id="media" value="/listings/Medias">Media</option>
          </select>
          <button type="button" onclick='refreshListings();' class="btn btn-outline-primary"> Sort </button>
        </div>
      </div>

      <div class="col col-md-2">
        <button type="button" onclick='insertForm();' class="btn btn-success w-100" data-bs-toggle="modal" data-bs-target="#ListingModal" >Add Listing</button>
      </div>
    </div>

    <!-- <div style="height:180px;width:180px;overflow:auto;"> -->
    <div class="row">
      <div class="col">
        <div class="list-group border border-primary scroll" id="eventListings"></div> 
      </div>
    </div>
  </div>

  <!-- New Listing Form (Modal) -->
  <div class="modal fade" id="ListingModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">

        <div class="modal-header">
          <h4 class="modal-title" id="modalTitle">Add A New Listing: </h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>

        <form class="was-validated" method="post" action="/listings">
          <div class="modal-body">
            <div class="container" id="MainForm">
              
              <div class="row mb-2" id="listingID" style="display:flex;">
                <div class="col-12 col-md mb-2">
                  <label for="listingID" class="form-label"> Listing ID:</label>
                  <input type="text" class="form-control" name="listingID" id="listingID" value="" autocomplete="off" readonly />
                </div>
              </div>

              <div class="row mb-2">
                <div class="col-12 col-md mb-2">
                  <label for="listingType" class="form-label">Set type of Listing:</label>
                  <select class="form-control" name="listingType" id="listingType" required>
                    <option id="identifyDefault" selected disabled placeholder="choose"> </option>
                    <option id="event">Event</option>
                    <option id="service">Service</option>
                    <option id="media">Media</option>
                    <option id="internship">Internship</option>
                    <option id="Resource">Resource</option>
                  </select>
                </div>
              </div>

              <div class="row mb-2">
                <div class="col-12 col-md mb-2">
                  <label for="listingTitle" class="form-label">English Listing Title:</label>
                  <input type="text" class="form-control" name="listingTitleEN" id="listingTitleEN" placeholder="Enter the Listing Title" required/>
                </div>
              </div>

              <div class="row mb-2">
                <div class="col-12 col-md mb-2">
                  <label for="listingBody" class="form-label" >Listing Info:</label>
                  <textarea class="form-control" id="listingBodyEN" name="listingBodyEN" rows="3" required></textarea>
                </div>
              </div>              

              <div class="row mb-2">
                <div class="col-12 col-md mb-2">
                  <label for="listingLink" class="form-label">Listing Link:</label>
                  <input type="text" class="form-control" name="listingLink" id="listingLink" placeholder="Enter an External Link"/>
                </div>
              </div>
              
              <div class="row mb-2">
                <div class="col-12 col-md mb-2">
                  <label for="listingStartDate" class="form-label" >Listing Start Date:</label>
                  <input type="datetime-local" class="form-control" name="listingStartDate" id="listingStartDate"/>
                </div>
              </div>

              <div class = "row mb-2">
                <div class="col-12 col-md mb-2">
                  <label for="listingEndDate" class="form-label" >Listing End Date:</label>
                  <input type="date" class="form-control" name="listingEndDate" id="listingEndDate"/>
                </div>  
              </div>

              <div class="row mb-4">
                <div class="col-6">
                  <input type="checkbox" id="listAutoOpen" name="listAutoOpen" checked />
                  <label for="listAutoOpen">Auto-Open on Start Date</label>
                </div>
                <div class="col-6">
                  <input type="checkbox" id="listAutoClose" name="listAutoClose" checked>
                  <label for="listAutoClose">Auto-Close on End Date</label>
                </div>
              </div>

              <div class="row mb-2" style="display: none;" id="test1">
                <!-- <div class="row mb-2" style="display: none;" id="test1"> -->
                <label for="listingTitleFR" class="form-label">French Listing Title:</label>
                <div class="col-12 col-md mb-2">
                  <input type="text" class="form-control" name="listingTitleFR" id="listingTitleFR" placeholder="Enter the Listing Title in French"/>
                </div>
              </div>

              <div class="row mb-2" style="display: none;" id="test2">
                <!-- <div class="row mb-2" style="display: none;" id="test2"> -->
                <label for="listingBodyFR" class="form-label" >French Listing Info:</label>
                <div class="col-12 col-md mb-2">
                  <textarea class="form-control" id="listingBodyFR" name="listingBodyFR" rows="3" ></textarea>
                </div>
              </div>    
            </div>
          </div>
        
          <div class="modal-footer">
            <a class="btn btn-success" onclick='toggleFrenchModal();'> <i class="bi bi-translate"></i>Toggle French</a>
            <button type="submit" class="btn btn-primary">Submit</button>
            <a href="" class="btn btn-secondary" onclick="conf();" id="delete_button" style="display: none;"> Delete </a>
            <button type="reset" class="btn btn-secondary" id="clear_button" style="display: flex;"> Clear </button>
            <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Cancel</button>
          </div>
        </form>

      </div>
    </div>
  </div>

  <script>

    let listings = [];
    let dateString = function(dateObj){return new Date(dateObj).toDateString();}
    
    function refreshListings()
    {
      let temp = document.getElementById('filter');
      console.log('worked');
      var address = temp.options[temp.selectedIndex].value;
      console.log(address);
      getListings(address);

    }

    async function getListings( address )
    { 
      let response = await fetch(address);
      listings = await response.json();

      let out = ``;

      for(let i=0;i<listings.length;i++) 
      {
        let tempStart = new Date(listings[i].listStart);
        let tempEnd = new Date(listings[i].listEnd);
        out+= `      
        <button type="button" class="list-group-item list-group-item-action" data-bs-toggle="modal" onclick="editForm(${i});" data-bs-target="#ListingModal">
          <div class="d-flex w-100 justify-content-between">
            <h5 class="mb-1"> ${listings[i].title}</h5>
            <small>Open ${tempStart.toLocaleDateString()} - Close ${tempEnd.toLocaleDateString()}</small>
          </div>
          <p class="listing-body mb-1">${listings[i].body}</p>
          <small>Click for more info</small>
        </button>` ;
      }
      document.getElementById('eventListings').innerHTML = out;
    }
    refreshListings();

    function editForm(pos)
    {
      document.getElementById("modalTitle").innerHTML = "Edit Listing";
      document.getElementById("listingID").style = 'display:flex;';
      document.getElementById("listingID").value = listings[pos]._id;
      document.getElementById("listingTitleEN").value = listings[pos].title;
      document.getElementById("listingBodyEN").value = listings[pos].body;
      document.getElementById("listingLink").value = listings[pos].link;
      document.getElementById("listingStartDate").value = new Date(listings[pos].listStart).toLocaleDateString();
      console.log(listings[pos].listStart);
      console.log(document.getElementById("listingStartDate").value);
      document.getElementById("listingEndDate").value = listings[pos].listEnd;


      //if (document.getElementById("listAutoOpen").hasAttribute("checked"))
        document.getElementById("listAutoOpen").removeAttribute("checked");
        
      //if (document.getElementById("listAutoClose").hasAttribute("checked"))
        document.getElementById("listAutoClose").removeAttribute("checked");

     document.getElementById("listingTitleFR").value = listings[pos].titleFR;
     document.getElementById("listingBodyFR").value = listings[pos].bodyFR;
     // document.getElementById("delete_button").setAttribute('href', "https://developer.mozilla.org/en-US/docs/Web/HTML/Global_attributes/class");
     document.getElementById("delete_button").setAttribute('href', `/deletelistings/${listings[pos]._id}`);
     document.getElementById("clear_button").style = 'display: none;';
     document.getElementById("delete_button").style = 'display: flex;';
    }

    function insertForm(){
        document.getElementById("listingID").style = 'display:none;';
        document.getElementById("listingTitleEN").value = '';
        document.getElementById("listingBodyEN").value = '';
        document.getElementById("listingLink").value = '';

        //if (document.getElementById("listAutoOpen").hasAttribute("checked"))
            document.getElementById("listAutoOpen").removeAttribute("checked");
        
        //if (document.getElementById("listAutoClose").hasAttribute("checked"))
            document.getElementById("listAutoClose").removeAttribute("checked");

       document.getElementById("listingTitleFR").value = '';
       document.getElementById("listingBodyFR").value = '';
       document.getElementById("clear_button").style = 'display: flex;';
       document.getElementById("delete_button").style = 'display: none;';
    }

    function toggleFrenchModal()
    {
        let titleFr = document.getElementById('test1');
        let bodyFr = document.getElementById('test2');
        
        if (titleFr.getAttribute('style')== 'display: none;')
        {
            titleFr.style = 'display: flex;';
            bodyFr.style = 'display: flex;';
        }
        else
        {
            titleFr.style = 'display: none;';
            bodyFr.style = 'display: none;';
        }      
    }

    function conf()
    {
      return window.confirm('Are you sure you want to delete?');
    }

  </script>

</body>

</html>
