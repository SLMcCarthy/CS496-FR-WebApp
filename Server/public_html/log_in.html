<!DOCTYPE html>

<html>
  <head>
    <title> Let's Go France log_in </title>
    <meta charset="utf-8"> <!-- charset --> 
    <meta name="description" content="log in page" /> 
    <meta name="author" content="Jeremy Unanue, Shane McCarthy" />
    <meta name="viewport" content="width=device-width, initial-scale=1"> <!-- viewport --> 
 
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"> <!-- Bootstrap CSS --> 
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script> <!-- Bootstrap JS --> 
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">  <!-- Bootstrap Icons -->   

    <style>

      .bg-text 
      {
        text-align: center; 
        color: white;
        text-shadow: 2px 2px 5px rgba(0,0,0,0.8), 0px 0px 2px  rgba(0,0,0,1);
      }
      /* Current BG images are placeholders */
      .hero-bg-image 
      {
        background-image: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), url('./images/Colmar.jpeg');

        /* Set a specific height */
        height: 50%;
        max-height: 220px;

        /* Position and center the image to scale nicely on all screens */
        background-position: center;
        background-repeat: no-repeat;
        background-size: cover;
        position: relative;
      }

    </style>
</head>

<body>  
  <div class="container-fluid">
    <header class="d-flex flex-wrap align-items-center justify-content-center justify-content-md-between py-3 mb-4 border-bottom border-danger">
			<div class="d-flex align-items-center col-md-3 mb-2 mb-md-0 text-dark text-decoration-none">
        <img class="img-fluid" width="100px" height="100px" src="./img/frlogo.jpg" alt="France Icon">
      </div>

      <ul class="nav col-12 col-md-auto mb-2 justify-content-center mb-md-0">
        <li><a href="./homepage.html" class="nav-link px-2 link-secondary"><i class="bi bi-house-door"></i></a></li>
        <li><a href="./eventspage.html" class="nav-link px-2 link-dark">Events</a></li>
        <li><a href="#" class="nav-link px-2 link-dark">Study Abroad</a></li>
        <li><a href="./internshippage.html" class="nav-link px-2 link-dark">Internships</a></li>
        <li><a href="./servicepage.html" class="nav-link px-2 link-dark">Services</a></li>
        <li><a href="#" class="nav-link px-2 link-dark">Resources</a></li>
        <li><a href="./mediapage.html" class="nav-link px-2 link-dark">Media</a></li>
      </ul>
    </header>
  </div>

  <!-- Hero -->
  <div class="container-fluid">
    <div class="hero-bg-image p-5 text-center rounded mb-5">
      <div class="bg-text" style="text-align: center; color: white;"> <!-- Need to find a better text color -->
        <h1 style="font-weight: bold;">Content De Te Revoir!</h1>
        <h1 style="font-weight: bold;">Log in</h1><br/>

      </div>
    </div>
  </div>


  <!-- User Log In Form -->
  <div class="container">
    <form action="/user" class="form-horizontal" id="signUp" method="post">
      <div class="form-group"><input type="hidden" id="userId" name="userId"></div>

      <div class="row mt-5 justify-content-center align-items-center">
        <div class="col-12 col-md-4">
          <div class="form-group">
            <label for="userEmail" class="form-label">Email: </label>
            <input class="form-control" type="email" name="userEmail" id="userEmail" required><br/><br/>
          </div>
        </div>
        <div class="col-12 col-md-4">
          <div class="form-group">
            <label for="userPassword" class="form-label">Password:</label>
            <input type="password" class="form-control" name="userPassword" id="userPassword" minlength="6" required><br/><br/>
          </div>
        </div>
      </div>

      <div class="row justify-content-center">
        <div class="col-md-auto mb-3 g-3">
          <button type="submit" onclick="validateLogin();" class="w-100 btn btn-primary">Login</button>
        </div>
        <div class="col-md-auto mb-3 g-3 justify-content-center">
          <a href="/homepage.html" class="w-100 btn btn-secondary" role="button" type="reset">Cancel</a>
        </div>
      </div>

      <div class="row" style="text-align: center;">
        <div class="col">
          <p>Don't have an account? <a href="/sign_up.html">Sign Up!</a></p>
        </div>
      </div>

    </form>
  </div>

  <div class="container">
    <div class="row">
      <div class="col-md-6" id="invalidLogin">
      </div>
    </div>
  </div>

  <script>

    function validateLogin()
    {
      const params = new URLSearchParams(window.location.search);    
      let alert = null;

      if(params.get('error') === '1')
      {
        alert = `
          <div class="alert alert-danger alert-dismissible">
              <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
              <strong>Error!</strong> Incorrect Login or Password.
            </div>`;
        document.getElementById("invalidLogin").innerHTML = alert;
      } 
    }

  </script>

</body>

</html>
